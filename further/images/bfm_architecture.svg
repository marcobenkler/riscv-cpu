<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="Helvetica, Arial, sans-serif">
  <title>AXI-Lite BFM Layering (LSU Test)</title>
  <desc>HVL agent with driver and monitor proxies; in the HDL top the subordinate and monitor BFMs connect to the wires-only axil_if, which the LSU also connects to. The master BFM is not instantiated in this top.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      /* Same palette as lsu_testbench.svg: saturated opaque boxes with white text,
         blue for everything drawn directly on the background. */
      .region     { fill: none; stroke: #888780; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .box-gray   { fill: #444441; stroke: #888780; stroke-width: 1.5; }
      .box-purple { fill: #534AB7; stroke: #7F77DD; stroke-width: 1; }
      .box-teal   { fill: #0F6E56; stroke: #1D9E75; stroke-width: 1.5; }
      .box-blue   { fill: #185FA5; stroke: #378ADD; stroke-width: 1.5; }
      .th  { font-size: 14px; font-weight: 600; }
      .ts  { font-size: 12px; }
      .white   { fill: #FFFFFF; }
      .purple2 { fill: #CECBF6; }
      .teal2   { fill: #9FE1CB; }
      .blue2   { fill: #B5D4F4; }
      .out { fill: #378ADD; font-weight: 600; }
      .arr { stroke: #378ADD; stroke-width: 1.75; fill: none; }
    </style>
  </defs>

  <!-- HVL region -->
  <rect class="region" x="40" y="20" width="600" height="130" rx="16"/>
  <text class="th out" x="60" y="46">HVL side</text>
  <text class="ts out" x="60" y="64">untimed classes</text>

  <!-- Agent -->
  <rect class="box-gray" x="220" y="34" width="400" height="104" rx="12"/>
  <text class="th white" x="420" y="52" text-anchor="middle" dominant-baseline="central">axil_agent (role = subordinate)</text>

  <rect class="box-purple" x="240" y="70" width="150" height="56" rx="8"/>
  <text class="th white" x="315" y="88" text-anchor="middle" dominant-baseline="central">Driver</text>
  <text class="ts purple2" x="315" y="108" text-anchor="middle" dominant-baseline="central">proxy, no timing</text>

  <rect class="box-purple" x="450" y="70" width="150" height="56" rx="8"/>
  <text class="th white" x="525" y="88" text-anchor="middle" dominant-baseline="central">Monitor</text>
  <text class="ts purple2" x="525" y="108" text-anchor="middle" dominant-baseline="central">proxy, no timing</text>

  <!-- HDL region -->
  <rect class="region" x="40" y="190" width="600" height="330" rx="16"/>
  <text class="th out" x="60" y="214">HDL top</text>
  <text class="ts out" x="60" y="232">timed, synthesizable</text>

  <!-- BFMs -->
  <g opacity="0.4">
    <rect class="box-purple" x="60" y="250" width="150" height="56" rx="8" stroke-dasharray="4 3"/>
    <text class="th white" x="135" y="268" text-anchor="middle" dominant-baseline="central">axil_mst_bfm</text>
    <text class="ts purple2" x="135" y="288" text-anchor="middle" dominant-baseline="central">not in this top</text>
  </g>

  <rect class="box-purple" x="240" y="250" width="150" height="56" rx="8"/>
  <text class="th white" x="315" y="268" text-anchor="middle" dominant-baseline="central">axil_slv_bfm</text>
  <text class="ts purple2" x="315" y="288" text-anchor="middle" dominant-baseline="central">drives READY, B, R</text>

  <rect class="box-purple" x="450" y="250" width="150" height="56" rx="8"/>
  <text class="th white" x="525" y="268" text-anchor="middle" dominant-baseline="central">axil_mon_bfm</text>
  <text class="ts purple2" x="525" y="288" text-anchor="middle" dominant-baseline="central">reads only</text>

  <!-- Virtual interface handles -->
  <line class="arr" x1="315" y1="128" x2="315" y2="246" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line class="arr" x1="525" y1="128" x2="525" y2="246" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts out" x="330" y="172">virtual interface</text>

  <!-- Signal interface -->
  <rect class="box-blue" x="60" y="350" width="560" height="56" rx="8"/>
  <text class="th white" x="340" y="368" text-anchor="middle" dominant-baseline="central">axil_if</text>
  <text class="ts blue2" x="340" y="388" text-anchor="middle" dominant-baseline="central">wires only, no logic</text>

  <!-- Port connections -->
  <line class="arr" x1="315" y1="310" x2="315" y2="346" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="arr" x1="525" y1="348" x2="525" y2="310" marker-end="url(#arrow)"/>

  <!-- DUT -->
  <rect class="box-teal" x="220" y="446" width="190" height="56" rx="8"/>
  <text class="th white" x="315" y="464" text-anchor="middle" dominant-baseline="central">LSU (DUT)</text>
  <text class="ts teal2" x="315" y="484" text-anchor="middle" dominant-baseline="central">drives VALID + payload</text>
  <line class="arr" x1="315" y1="410" x2="315" y2="442" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line class="arr" x1="450" y1="462" x2="480" y2="462"/>
  <text class="ts out" x="488" y="462" dominant-baseline="central">port connection</text>
  <line class="arr" x1="450" y1="488" x2="480" y2="488" stroke-dasharray="4 3"/>
  <text class="ts out" x="488" y="488" dominant-baseline="central">virtual interface</text>
</svg>
